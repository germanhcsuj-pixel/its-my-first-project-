<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #FF0055; --glass: rgba(6,6,10,0.65); }

    body { overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background:
            radial-gradient(ellipse 55% 55% at 50% 50%, rgba(18,3,28,0.9) 0%, transparent 70%),
            radial-gradient(ellipse 100% 100% at 50% 50%, #06020c 0%, #000 100%);
    }

    #canvas-container { width: 100vw; height: 100vh; position: relative; z-index: 1; }

    #loading {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        color: rgba(255,255,255,0.45);
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.72rem; letter-spacing: 4px;
        pointer-events: none; transition: opacity 0.9s ease; z-index: 20;
    }
    #loading::after {
        content: ''; display: inline-block; width: 5px; height: 5px;
        border-radius: 50%; background: var(--accent); margin-left: 7px;
        vertical-align: middle; animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #ui-panel {
        position: absolute; top: 10px; left: 10px; z-index: 10;
        display: flex; flex-direction: column; gap: 5px;
        transform: scale(0.7);
        transform-origin: top left;
    }

    #theme-selector {
        display: flex; gap: 8px; align-items: center;
        padding: 6px 10px;
        background: var(--glass);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.7);
        transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .theme-swatch {
        width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
        border: 1.5px solid rgba(255,255,255,0.15); position: relative;
        transition: transform 0.25s cubic-bezier(0.175,0.885,0.32,1.275), border-color 0.25s;
    }
    .theme-swatch::after {
        content: ''; position: absolute; inset: -4px; border-radius: 50%;
        border: 1px solid transparent; transition: border-color 0.25s, box-shadow 0.25s;
    }
    .theme-swatch:hover { transform: scale(1.2); }
    .theme-swatch.active { border-color: rgba(255,255,255,0.75); transform: scale(1.15); }
    .theme-swatch.active::after { border-color: rgba(255,255,255,0.2); box-shadow: 0 0 8px 2px currentColor; }

    #theme-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.5rem; letter-spacing: 2px;
        color: rgba(255,255,255,0.28); padding-left: 4px;
        transition: color 0.4s ease; user-select: none;
    }

    #stats {
        position: absolute; bottom: 10px; right: 10px; z-index: 10;
        text-align: right; font-family: 'Share Tech Mono', monospace;
        font-size: 0.5rem; letter-spacing: 1px; line-height: 1.5;
        color: rgba(255,255,255,0.16); pointer-events: none; user-select: none;
    }
    #stats span { display: block; }

    #scanlines {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.035) 3px, rgba(0,0,0,0.035) 4px);
        opacity: 0.6;
    }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="scanlines"></div>
<div id="loading">INITIALIZING CORE</div>
<div id="stats">
    <span id="stat-nodes">NODES — 300</span>
    <span id="stat-fps">FPS — —</span>
</div>
<div id="canvas-container"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PARTICLE_COUNT  = 300;
const SPHERE_RADIUS   = 12.0;
const PARTICLE_SIZE   = 1.1;
const CORE_SIZE       = 6.5;
const TRAVELLER_COUNT = 55;
const ARC_COUNT       = 14;
const ARC_SEGMENTS    = 32;

const THEMES = [
    { name: "NEON MAGENTA", base: new THREE.Color(0xFF0055), core: new THREE.Color(0xFF0033), hex: "#FF0055" },
    { name: "CYBER CYAN",   base: new THREE.Color(0x00E5FF), core: new THREE.Color(0x00BBDD), hex: "#00E5FF" },
    { name: "ACID LIME",    base: new THREE.Color(0xB8FF40), core: new THREE.Color(0x88DD18), hex: "#B8FF40" },
    { name: "SOLAR GOLD",   base: new THREE.Color(0xFFB700), core: new THREE.Color(0xFF9200), hex: "#FFB700" },
];
let currentThemeIdx = 0;

const container = document.getElementById('canvas-container');
const scene     = new THREE.Scene();
scene.fog       = new THREE.FogExp2(0x000000, 0.011);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 38);

function getResponsiveFOV() {
    const aspect = innerWidth / innerHeight;
    if (aspect < 0.75)  return 64;
    if (aspect < 1.0)   return 54;
    if (aspect < 1.4)   return 46;
    return 40;
}
camera.fov = getResponsiveFOV();
camera.updateProjectionMatrix();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.04;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.5;
controls.enablePan       = false;
controls.enableZoom      = false; // Disable zooming
controls.minDistance     = 18;
controls.maxDistance     = 70;

function createXTexture(glow) {
    const size = 512;
    const cv   = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx  = cv.getContext('2d');
    if (glow) {
        const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size * 0.38);
        g.addColorStop(0, 'rgba(255,255,255,0.20)');
        g.addColorStop(0.55, 'rgba(255,255,255,0.05)');
        g.addColorStop(1, 'rgba(255,255,255,0.0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(256, 48); // Top
    ctx.quadraticCurveTo(256, 256, 464, 256); // Right
    ctx.quadraticCurveTo(256, 256, 256, 464); // Bottom
    ctx.quadraticCurveTo(256, 256, 48, 256); // Left
    ctx.quadraticCurveTo(256, 256, 256, 48); // Top
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}
const logoTexture     = createXTexture(false);
const logoGlowTexture = createXTexture(true);

const voidMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(0.0,0.0,0.0,1.0);
            mv.xy  += position.xy;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        varying vec2 vUv;
        void main() {
            float d = length(vUv - 0.5) * 2.0;
            float a = smoothstep(1.0, 0.55, d) * 0.90;
            gl_FragColor = vec4(0.0, 0.0, 0.0, a);
        }
    `,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
});
const voidMesh = new THREE.Mesh(new THREE.CircleGeometry(CORE_SIZE * 0.72, 64), voidMat);
voidMesh.position.z = -0.3;
voidMesh.renderOrder = 2;
scene.add(voidMesh);

const haloMat = new THREE.ShaderMaterial({
    uniforms: {
        uTime:      { value: 0 },
        uGlowColor: { value: THEMES[0].core.clone() },
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(0.0,0.0,-0.15,1.0);
            mv.xy  += position.xy;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        uniform float uTime;
        uniform vec3  uGlowColor;
        varying vec2  vUv;
        void main() {
            float d     = length(vUv - 0.5);
            float inner = smoothstep(0.38, 0.12, d) * 0.35;
            float outer = smoothstep(0.50, 0.28, d) * 0.10;
            float pulse = sin(uTime * 1.4) * 0.5 + 0.5;
            float a     = (inner + outer) * (0.65 + pulse * 0.22);
            gl_FragColor = vec4(uGlowColor, a);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(CORE_SIZE * 2.6, CORE_SIZE * 2.6), haloMat);
haloMesh.position.z = -0.15;
haloMesh.renderOrder = 3;
scene.add(haloMesh);

const coreMat = new THREE.ShaderMaterial({
    uniforms: {
        uTexture:   { value: logoGlowTexture },
        uTime:      { value: 0 },
        uGlowColor: { value: THEMES[0].core.clone() },
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(0.0,0.0,0.0,1.0);
            mv.xy  += position.xy;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        uniform sampler2D uTexture;
        uniform float     uTime;
        uniform vec3      uGlowColor;
        varying vec2      vUv;
        void main() {
            vec4 tex = texture2D(uTexture, vUv);
            if (tex.a < 0.03) discard;
            float pulse = sin(uTime * 1.7) * 0.5 + 0.5;
            vec3  col   = mix(uGlowColor * 0.9, vec3(0.88,0.88,0.88), pulse * 0.28 + 0.18);
            gl_FragColor = vec4(col, tex.a * 0.90);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const coreMesh = new THREE.Mesh(new THREE.PlaneGeometry(CORE_SIZE, CORE_SIZE), coreMat);
coreMesh.position.z = 0.1;
coreMesh.renderOrder = 4;
scene.add(coreMesh);

const ARC_TOTAL_VERTS = ARC_COUNT * (ARC_SEGMENTS + 1);
const arcPosArr       = new Float32Array(ARC_TOTAL_VERTS * 3);
const arcAlphaArr     = new Float32Array(ARC_TOTAL_VERTS);

const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPosArr, 3));
arcGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(arcAlphaArr, 1));

const arcIdxArr = [];
for (let a = 0; a < ARC_COUNT; a++) {
    const base = a * (ARC_SEGMENTS + 1);
    for (let s = 0; s < ARC_SEGMENTS; s++) {
        arcIdxArr.push(base + s, base + s + 1);
    }
}
arcGeo.setIndex(arcIdxArr);

const arcMat = new THREE.ShaderMaterial({
    uniforms: {
        uBaseColor: { value: THEMES[0].base.clone() },
        uTime:      { value: 0 },
    },
    vertexShader: `
        attribute float aAlpha;
        varying   float vAlpha;
        void main() {
            vAlpha      = aAlpha;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform vec3  uBaseColor;
        uniform float uTime;
        varying float vAlpha;
        void main() {
            if (vAlpha < 0.01) discard;
            vec3 col = mix(uBaseColor * 1.4, vec3(1.0, 1.0, 1.0), vAlpha * 0.80);
            col += uBaseColor * 0.35;
            gl_FragColor = vec4(col, vAlpha * 1.0);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const arcLines = new THREE.LineSegments(arcGeo, arcMat);

const arcDirs   = [];
const arcPhases = [];
const _axis     = new THREE.Vector3();
const _right    = new THREE.Vector3();

for (let a = 0; a < ARC_COUNT; a++) {
    const phi   = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    arcDirs.push(new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.sin(phi) * Math.sin(theta),
        Math.cos(phi)
    ).normalize());
    arcPhases.push(Math.random() * Math.PI * 2);
}

function updateArcs(t) {
    const posArr = arcGeo.attributes.position.array;
    const alpArr = arcGeo.attributes.aAlpha.array;

    for (let a = 0; a < ARC_COUNT; a++) {
        const dir   = arcDirs[a];
        const ph    = arcPhases[a];
        const base  = a * (ARC_SEGMENTS + 1);
        const front = ((t * 0.75 + ph * 0.55) % 1.6) / 1.6;

        for (let s = 0; s <= ARC_SEGMENTS; s++) {
            const segT = s / ARC_SEGMENTS;
            const r    = segT * SPHERE_RADIUS;
            const vi   = base + s;

            posArr[vi * 3]     = dir.x * r;
            posArr[vi * 3 + 1] = dir.y * r;
            posArr[vi * 3 + 2] = dir.z * r;

        const head = Math.max(0, 1 - Math.abs(segT - front) / 0.16);
        const tail = segT < front
            ? Math.max(0, 1 - (front - segT) / 0.62) * 0.55
            : 0;
        alpArr[vi] = Math.min(1.0, head + tail);
        }
    }
    arcGeo.attributes.position.needsUpdate = true;
    arcGeo.attributes.aAlpha.needsUpdate   = true;
}

const travGeo = new THREE.BufferGeometry();
const travPos = new Float32Array(TRAVELLER_COUNT * 3);
travGeo.setAttribute('position', new THREE.BufferAttribute(travPos, 3));
const travSizes = new Float32Array(TRAVELLER_COUNT);
for (let i = 0; i < TRAVELLER_COUNT; i++) travSizes[i] = 0.06 + Math.random() * 0.20;
travGeo.setAttribute('size', new THREE.BufferAttribute(travSizes, 1));

const travellers = Array.from({ length: TRAVELLER_COUNT }, () => {
    const axis = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    const perp = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)
                     .cross(axis).normalize();
    return {
        axis,
        perp,
        speed:  0.35 + Math.random() * 0.8,
        phase:  Math.random() * Math.PI * 2,
        radius: SPHERE_RADIUS * (0.91 + Math.random() * 0.10),
    };
});

const travMat = new THREE.ShaderMaterial({
    uniforms: { uBaseColor: { value: THEMES[0].base.clone() } },
    vertexShader: `
        attribute float size;
        void main() {
            vec4 mv     = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (420.0 / -mv.z);
            gl_Position  = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        uniform vec3 uBaseColor;
        void main() {
            vec2  uv   = gl_PointCoord - 0.5;
            float d    = length(uv);
            float spot = smoothstep(0.5, 0.0, d);
            if (spot < 0.01) discard;
            vec3 col = mix(uBaseColor * 0.9, vec3(1.0), spot * 0.55);
            gl_FragColor = vec4(col, spot * 0.95);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const travPoints = new THREE.Points(travGeo, travMat);

const _q = new THREE.Quaternion();
function updateTravellers(t) {
    const pa = travGeo.attributes.position.array;
    travellers.forEach((tr, i) => {
        const angle = t * tr.speed + tr.phase;
        _q.setFromAxisAngle(tr.axis, angle);
        const p = tr.perp.clone().applyQuaternion(_q).multiplyScalar(tr.radius);
        pa[i*3] = p.x; pa[i*3+1] = p.y; pa[i*3+2] = p.z;
    });
    travGeo.attributes.position.needsUpdate = true;
}

const instGeo = new THREE.PlaneGeometry(PARTICLE_SIZE, PARTICLE_SIZE);
const phases  = new Float32Array(PARTICLE_COUNT);
for (let i = 0; i < PARTICLE_COUNT; i++) phases[i] = Math.random() * Math.PI * 2;
instGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));

const instMat = new THREE.ShaderMaterial({
    uniforms: {
        uTexture:   { value: logoTexture },
        uTime:      { value: 0 },
        uBaseColor: { value: THEMES[0].base.clone() },
    },
    vertexShader: `
        attribute float aPhase;
        uniform   float uTime;
        varying   vec2  vUv;
        varying   float vPhase;
        varying   vec3  vWorldPos;
        varying   float vDepth;
        void main() {
            vUv    = uv;
            vPhase = aPhase;
            vec3  iPos  = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
            float scale = length(vec3(instanceMatrix[0][0], instanceMatrix[0][1], instanceMatrix[0][2]));
            iPos += normalize(iPos) * sin(uTime * 1.2 + aPhase) * 0.38;
            vWorldPos = iPos;
            vec4 camP = viewMatrix * modelMatrix * vec4(iPos, 1.0);
            vDepth    = clamp(-camP.z / 38.0, 0.0, 1.0);
            vec4 mv   = viewMatrix * modelMatrix * vec4(iPos, 1.0);
            mv.xy    += position.xy * scale;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        uniform sampler2D uTexture;
        uniform float     uTime;
        uniform vec3      uBaseColor;
        varying vec2      vUv;
        varying float     vPhase;
        varying vec3      vWorldPos;
        varying float     vDepth;
        void main() {
            vec4  tex  = texture2D(uTexture, vUv);
            float dist = length(vUv - 0.5);
            float aura = smoothstep(0.5, 0.10, dist) * 0.22;
            float a    = tex.a + aura;
            if (a < 0.04) discard;

            float pulse = sin(uTime * 1.8 + vPhase) * 0.5 + 0.5;

            float w1 = sin(vWorldPos.y * 0.35 + vWorldPos.x * 0.20 - uTime * 3.2);
            float w2 = sin(vWorldPos.z * 0.30 - vWorldPos.y * 0.25 + uTime * 2.6);
            float hit = smoothstep(0.68, 1.0, w1) * 0.65 + smoothstep(0.72, 1.0, w2) * 0.45;

            vec3 col  = mix(uBaseColor * 0.85, uBaseColor * 1.3 + vec3(0.45), pulse * 0.38);
            col      += uBaseColor * hit * 1.4 + vec3(1.0) * hit * 0.35;

            float depthFade = 0.52 + 0.48 * (1.0 - vDepth);
            float bright    = tex.a > 0.1 ? 1.15 : 0.55;

            gl_FragColor = vec4(
                col * bright * depthFade,
                a * (0.48 + 0.36 * pulse + hit * 0.38) * depthFade
            );
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});

const sphereMesh = new THREE.InstancedMesh(instGeo, instMat, PARTICLE_COUNT);
const dummy      = new THREE.Object3D();
const phi_c      = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < PARTICLE_COUNT; i++) {
    const y      = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
    const r      = Math.sqrt(1 - y * y);
    const theta  = phi_c * i;
    const radius = SPHERE_RADIUS + (Math.random() - 0.5) * 1.5;
    dummy.position.set(Math.cos(theta)*r*radius, y*radius, Math.sin(theta)*r*radius);
    const s = 0.45 + Math.random() * 0.72;
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    sphereMesh.setMatrixAt(i, dummy.matrix);
}

const ringMeshes = [], ringMats = [];
[[Math.PI/2, 0], [Math.PI/5, Math.PI/4], [-Math.PI/7, Math.PI/2]].forEach(([rx, ry]) => {
    const rm = new THREE.MeshBasicMaterial({
        color: THEMES[0].base.clone(),
        transparent: true, opacity: 0.07,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide, depthWrite: false,
    });
    const rmesh = new THREE.Mesh(new THREE.RingGeometry(SPHERE_RADIUS*0.91, SPHERE_RADIUS*0.935, 128), rm);
    rmesh.rotation.x = rx; rmesh.rotation.y = ry;
    ringMeshes.push(rmesh); ringMats.push(rm);
});

const sPos = new Float32Array(900 * 3);
for (let i = 0; i < 900 * 3; i++) sPos[i] = (Math.random()-0.5)*300;
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 0.18, color: 0xffffff, transparent: true, opacity: 0.22,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
})));

const mainGroup = new THREE.Group();
mainGroup.add(sphereMesh, arcLines, travPoints, ...ringMeshes);
scene.add(mainGroup);

const statFPS   = document.getElementById('stat-fps');
// Theme logic removed
currentThemeIdx = 1; // Default to Cyber Cyan for a cool blue look
document.documentElement.style.setProperty('--accent', THEMES[currentThemeIdx].hex);

document.getElementById('loading').style.opacity = '0';
const clock = new THREE.Clock();
let frames = 0, lastFPST = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    frames++;
    const now = performance.now();
    if (now - lastFPST >= 1000) {
        statFPS.textContent = `FPS — ${frames}`;
        frames = 0; lastFPST = now;
    }

    const theme = THEMES[currentThemeIdx];
    instMat.uniforms.uBaseColor.value.lerp(theme.base, 0.04);
    coreMat.uniforms.uGlowColor.value.lerp(theme.core, 0.04);
    haloMat.uniforms.uGlowColor.value.lerp(theme.core, 0.04);
    arcMat.uniforms.uBaseColor.value.lerp(theme.base, 0.04);
    travMat.uniforms.uBaseColor.value.lerp(theme.base, 0.04);
    ringMats.forEach(m => m.color.lerp(theme.base, 0.04));

    coreMat.uniforms.uTime.value = t;
    haloMat.uniforms.uTime.value = t;
    instMat.uniforms.uTime.value = t;

    updateArcs(t);
    updateTravellers(t);

    mainGroup.rotation.y = t * 0.09;
    mainGroup.rotation.z = Math.sin(t * 0.035) * 0.08;
    ringMeshes[0].rotation.y = t * 0.12;
    ringMeshes[1].rotation.y = -t * 0.08;

    // Removed theme selector box shadow animation

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.fov    = getResponsiveFOV();
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
